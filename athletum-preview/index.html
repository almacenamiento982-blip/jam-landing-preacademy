<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Juventus Pre-Academy Miami · Season 2026/27</title>
<meta name="description" content="Juventus Pre-Academy in Miami: fun, structured soccer for boys and girls ages 3 to 16 at 5 locations in Miami-Dade and Broward. Register online.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"Juventus Fans";src:url("../assets/jfans-bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--negro:#0b0b0c;--negro2:#151517;--blanco:#fff;--oro:#a87a2d;--oro2:#c49a4f;--crema:#f5f0e7;--tinta:#1a1a1c;--gris:#5d5a55;--linea:#e4ddd0;--ok:#2f7a4c;
  --tit:"Juventus Fans","Barlow Condensed","Arial Narrow",sans-serif;--txt:"Barlow",system-ui,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--blanco);color:var(--tinta);font:17px/1.55 var(--txt);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--tit);font-weight:700;text-transform:uppercase;line-height:.95;margin:0;letter-spacing:.5px;text-wrap:balance}
.eyebrow{font:600 13px/1 var(--txt);letter-spacing:3px;text-transform:uppercase;color:var(--oro2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 16px/1 var(--txt);letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;border:0;border-radius:6px;padding:18px 28px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.btn-oro{background:var(--oro);color:#fff;box-shadow:0 10px 24px -10px rgba(168,122,45,.8)}
.btn-oro:hover{background:#946a24;transform:translateY(-1px)}
.btn-wa{background:transparent;color:inherit;border:1.5px solid currentColor;padding:16px 22px;font-size:14px}
.btn-wa svg{width:20px;height:20px}
.flecha{font-size:20px;line-height:0}

/* barra superior */
.top{position:absolute;inset:0 0 auto 0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.top img{height:46px;width:auto}
.idioma{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px}
.idioma button{font:700 12px/1 var(--txt);letter-spacing:1px;color:#fff;background:transparent;border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
.idioma button[aria-pressed=true]{background:#fff;color:var(--negro)}

/* portada: texto a la izquierda y foto completa a la derecha (en el celular, la foto arriba) */
.hero{position:relative;background:var(--negro);color:#fff;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);min-height:min(900px,100svh);overflow:hidden}
.hero-foto{position:relative;order:2;min-height:100%}
.hero-foto img,.hero-foto video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.hero-video{opacity:0;transition:opacity .6s}.hero-video.lista{opacity:1}
@media (prefers-reduced-motion:reduce){.hero-video{display:none}}
.hero-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--negro) 0%,rgba(11,11,12,.35) 22%,rgba(11,11,12,0) 45%),linear-gradient(180deg,rgba(11,11,12,.5) 0%,rgba(11,11,12,0) 18%)}
.hero-txt{position:relative;z-index:2;order:1;display:flex;flex-direction:column;justify-content:center;padding:120px 40px 56px max(20px,calc((100vw - 1180px)/2 + 20px))}
.hv{position:absolute;inset:0}.hv+.hv,.hero-amb,.hero-ancho,.cinta,.hero-prueba{display:none}
/* D (26-10, por defecto) · franja dorada en movimiento (como Kings League) y prueba social bajo los botones (como Sporta) */
.hero.v-d .cinta{display:block;order:2;position:relative;z-index:3;background:var(--oro);color:var(--negro);overflow:hidden;white-space:nowrap;padding:13px 0 11px}
.cinta-pista{display:inline-flex;animation:cinta 42s linear infinite}
.cinta-pista span{font:700 22px/1 var(--tit);text-transform:uppercase;letter-spacing:1px;padding-inline:18px}
.cinta-pista i{font-style:normal;color:#fff;font-size:16px;align-self:center}
@keyframes cinta{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.cinta-pista{animation:none}}
.hero.v-d .hero-prueba{display:flex;align-items:center;gap:12px;margin:22px 0 0;font:500 15px/1.35 var(--txt);color:#e2ddd3}
.hero-prueba b{color:#fff}
.caras{display:flex;flex:none}.caras img{flex:none;width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--negro);margin-left:-10px}.caras img:first-child{margin-left:0}
.hero.v-d h1{font-size:clamp(56px,8.2vw,124px)}
/* portada de cada sede (?sede=): días, horario y grupos de ESA sede, a la vista */
.hero.v-d.con-sede h1{font-size:clamp(48px,6.2vw,96px)}
.hero.con-sede .sub{margin-bottom:18px}
.hero-datos{display:grid;grid-template-columns:repeat(3,auto);width:fit-content;max-width:100%;margin:0 0 12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(11,11,12,.5);backdrop-filter:blur(6px)}
.hero-datos div{padding:12px 20px;border-left:1px solid rgba(255,255,255,.14)}.hero-datos div:first-child{border-left:0}
.hero-datos small{display:block;font:700 11px/1 var(--txt);letter-spacing:2px;text-transform:uppercase;color:var(--oro2);margin-bottom:7px}
.hero-datos b{font:600 17px/1.2 var(--txt);color:#fff}
.hero-lugar{margin:0 0 22px;font:500 15px/1.4 var(--txt);color:#e2ddd3}
.hero-lugar button{font:600 15px/1 var(--txt);color:var(--oro2);background:none;border:0;padding:0;margin-left:4px;cursor:pointer;text-decoration:underline}
/* 26-10: 3 versiones de la portada en el computador (?hero=a|b|c); en el celular las tres son iguales (foto arriba) */
@media (min-width:901px){
  /* D · video horizontal a todo lo ancho, niños a la derecha, texto a la izquierda (Inter, Milan, Lil' Kickers) */
  .hero.v-d{display:block;min-height:min(900px,100svh)}
  .hero.v-d .hero-foto{display:none}
  .hero.v-d .hero-ancho{display:block;position:absolute;inset:0}
  .hero-ancho img,.hero-ancho video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 50%}
  .hero-ancho::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,12,.88) 0%,rgba(11,11,12,.62) 32%,rgba(11,11,12,.08) 60%,rgba(11,11,12,0) 78%),linear-gradient(180deg,rgba(11,11,12,.55) 0%,rgba(11,11,12,0) 20%,rgba(11,11,12,0) 72%,rgba(11,11,12,.55) 100%)}
  .hero.v-d .hero-txt{min-height:calc(min(900px,100svh) - 46px);max-width:calc(max(20px,(100vw - 1180px)/2 + 20px) + 760px);padding-bottom:64px}
  .hero.v-d .cinta{position:absolute;left:0;right:0;bottom:0}
  .hero.v-d.con-sede .hero-txt{padding-top:96px;padding-bottom:58px}
  /* A · mosaico: tres videos verticales a todo lo ancho, texto encima con degradado (como IMG Academy / Juventus Academy) */
  .hero.v-a{display:block;min-height:min(860px,100svh)}
  .hero.v-a .hero-foto{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--oro2)}
  .hero.v-a .hv{position:relative;display:block;overflow:hidden}
  .hero.v-a .hero-foto::after{z-index:1;background:linear-gradient(90deg,rgba(11,11,12,.93) 0%,rgba(11,11,12,.78) 30%,rgba(11,11,12,.2) 60%,rgba(11,11,12,0) 100%),linear-gradient(180deg,rgba(11,11,12,.6) 0%,rgba(11,11,12,0) 22%,rgba(11,11,12,0) 70%,rgba(11,11,12,.75) 100%)}
  .hero.v-a .hero-txt{min-height:min(860px,100svh);max-width:calc(max(20px,(100vw - 1180px)/2 + 20px) + 760px)}
  /* B · ambiente: el mismo video, desenfocado y oscuro, llena el lado del texto */
  .hero.v-b .hero-amb{display:block;position:absolute;inset:-80px;width:calc(100% + 160px);height:calc(100% + 160px);max-width:none;object-fit:cover;filter:blur(42px) brightness(.5) saturate(1.25);z-index:0}
  .hero.v-b::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(60% 70% at 18% 60%,rgba(196,154,79,.18),rgba(196,154,79,0) 70%),linear-gradient(90deg,rgba(11,11,12,.55),rgba(11,11,12,.2))}
  .hero.v-b .hero-foto{z-index:1}
  .hero.v-b .hero-foto::after{background:linear-gradient(90deg,rgba(11,11,12,.55) 0%,rgba(11,11,12,0) 28%),linear-gradient(180deg,rgba(11,11,12,.45) 0%,rgba(11,11,12,0) 18%)}
  /* C · rayas: textura de la camiseta (rayas blanco y negro muy suaves), palabra JUVENTUS de fondo y brillo dorado */
  .hero.v-c .hero-txt{background:radial-gradient(55% 60% at 30% 85%,rgba(196,154,79,.2),rgba(196,154,79,0) 70%),repeating-linear-gradient(90deg,#0b0b0c 0 96px,#19191b 96px 192px);overflow:hidden}
  .hero.v-c .hero-txt::before{content:"JUVENTUS";position:absolute;left:-1vw;bottom:-3.2vw;font:700 19vw/1 var(--tit);color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.07);white-space:nowrap;pointer-events:none;z-index:-1}
  .hero.v-c .hero-foto::after{background:linear-gradient(90deg,rgba(11,11,12,.9) 0%,rgba(11,11,12,.3) 20%,rgba(11,11,12,0) 42%),linear-gradient(180deg,rgba(11,11,12,.5) 0%,rgba(11,11,12,0) 18%)}
}
.hero h1{font-size:clamp(54px,7.4vw,108px);margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--oro2)}
.hero .sub{max-width:560px;font-size:clamp(17px,1.6vw,20px);color:#ece8e1;margin:0 0 24px}
.chips-lbl{font:600 12px/1 var(--txt);letter-spacing:2px;text-transform:uppercase;color:#cfc8bb;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{font:600 15px/1 var(--txt);color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:11px 16px;cursor:pointer;backdrop-filter:blur(6px)}
.chip[aria-pressed=true]{background:#fff;color:var(--negro);border-color:#fff}
.chip .g{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--oro2);letter-spacing:.5px}
.chip[aria-pressed=true] .g{color:var(--oro)}
.acciones{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--oro);color:#fff;font:700 14px/1.2 var(--txt);letter-spacing:.5px;padding:10px 14px;border-radius:6px;margin-bottom:18px}
.badge.garantia{background:#fff;color:var(--negro)}

/* datos */
.datos{background:var(--negro);color:#fff;border-top:1px solid rgba(255,255,255,.08)}
.datos .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.dato{padding:26px 18px;border-left:1px solid rgba(255,255,255,.1)}
.dato:first-child{border-left:0}
.dato b{display:block;font-family:var(--tit);font-size:40px;line-height:1;color:var(--oro2);text-transform:uppercase}
.dato span{font-size:14px;color:#cfc8bb;letter-spacing:.3px}

/* sede */
.sec{padding-block:84px}
.sec-tit{display:flex;flex-direction:column;gap:12px;margin-bottom:34px}
.sec-tit h2{font-size:clamp(40px,5.4vw,64px)}
.sec-tit p{max-width:640px;margin:0;color:var(--gris)}
.crema{background:var(--crema)}
.sedes{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sede-card{position:relative;height:440px;border:0;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:#fff;background:var(--negro);padding:0;display:block;box-shadow:0 14px 30px -18px rgba(0,0,0,.55);transition:transform .2s,box-shadow .2s}
.sede-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.sede-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,0) 35%,rgba(11,11,12,.55) 62%,rgba(11,11,12,.94) 100%)}
.sede-card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -18px rgba(0,0,0,.6)}
.sede-card:hover img{transform:scale(1.05)}
.sc-info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 18px 18px;display:flex;flex-direction:column;gap:4px}
.sc-info h3{font-size:40px;line-height:.92}
.sc-zona{font:700 11px/1 var(--txt);letter-spacing:2px;text-transform:uppercase;color:var(--oro2)}
.sc-dias{font-size:14px;color:#e2ddd3}
.sc-ir{margin-top:10px;font:700 13px/1 var(--txt);letter-spacing:1.5px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:8px}
.sc-ir::after{content:"→";color:var(--oro2);font-size:18px;transition:transform .2s}
.sede-card:hover .sc-ir::after{transform:translateX(4px)}
.sc-cinta{position:absolute;top:14px;left:14px;z-index:2;background:var(--oro);color:#fff;font:700 11px/1 var(--txt);letter-spacing:1px;text-transform:uppercase;padding:8px 10px;border-radius:4px}
.btn-sedes{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.35);padding:16px 22px;font-size:14px}
.btn-sedes:hover{background:rgba(255,255,255,.16)}
.hero-sede{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 20px;font:600 15px/1.3 var(--txt);color:#e9e3d8}
.hero-sede b{font-family:var(--tit);font-size:28px;letter-spacing:.5px;text-transform:uppercase;color:#fff;font-weight:700}
.hero-sede button{font:600 14px/1 var(--txt);color:var(--oro2);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.panel{display:grid;grid-template-columns:1.1fr .9fr;gap:0;background:#fff;border:1px solid var(--linea);border-radius:16px;overflow:hidden}
.panel-info{padding:34px}
.panel-info h3{font-size:52px;margin-bottom:6px}
.panel-info .lugar{color:var(--gris);margin:0 0 22px}
.panel-info .lugar a{color:var(--oro);font-weight:600}
.fila{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--linea)}
.fila .k{flex:0 0 120px;font:700 12px/1.6 var(--txt);letter-spacing:1.5px;text-transform:uppercase;color:var(--oro)}
.grupos{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.grupos li{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.grupos li b{font-weight:600}
.precio small{color:var(--gris);display:block;font-size:14px}
.panel-foto{position:relative;min-height:420px}
.panel-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel .acciones{margin-top:22px}
.panel .btn-wa{color:var(--tinta)}
.otra{margin-top:16px;font-size:15px}
.otra button{font:inherit;color:var(--oro);font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

/* por qué */
.porque{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.razon{border-top:3px solid var(--oro);padding-top:18px}
.razon b{font-family:var(--tit);font-size:30px;line-height:1;text-transform:uppercase;display:block;margin-bottom:10px}
.razon p{margin:0;color:var(--gris);font-size:16px}
.fotos{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-top:44px}
.fotos img{width:100%;height:340px;object-fit:cover;border-radius:10px}

/* pasos */
.oscuro{background:var(--negro);color:#fff}
.oscuro .sec-tit p{color:#cfc8bb}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:p}
.paso{background:var(--negro2);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:28px;counter-increment:p}
.paso::before{content:counter(p);font-family:var(--tit);font-size:72px;line-height:.8;color:var(--oro2);display:block;margin-bottom:14px}
.paso h3{font-size:30px;margin-bottom:10px}
.paso p{margin:0;color:#d8d2c7;font-size:16px}
.paso .pkg{display:block;margin-top:12px;background:rgba(168,122,45,.16);border:1px dashed var(--oro2);border-radius:8px;padding:10px 12px;font:600 14px/1.4 var(--txt);color:#fff}
.pasos-cta{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* preguntas */
.faq{max-width:860px}
.faq details{border-top:1px solid var(--linea);padding:18px 0}
.faq details:last-child{border-bottom:1px solid var(--linea)}
.faq summary{list-style:none;cursor:pointer;font:600 19px/1.35 var(--txt);display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 28px/1 var(--txt);color:var(--oro)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:12px 0 0;color:var(--gris)}

/* cierre */
.cierre{position:relative;color:#fff;background:var(--negro);overflow:hidden}
.cierre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:.45}
.cierre .wrap{position:relative;padding-block:110px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.cierre h2{font-size:clamp(46px,7vw,92px);max-width:900px}
.cierre p{margin:0;max-width:560px;color:#ece8e1}
.pie{display:block;background:#050505;color:#a8a296;font-size:14px}
.pie .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding-block:34px}
.pie img{height:40px;width:auto}
.pie a{color:#e6dfd2;text-decoration:none}
.redes{display:flex;gap:16px}

/* barra fija en el celular */
.fija{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(11,11,12,.94);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.1)}
.fija .btn{flex:1;padding:16px 10px;font-size:15px}
.fija .btn-wa{flex:0 0 auto;color:#fff;padding:14px}

/* WhatsApp: ayuda flotante, no botón principal */
.wa-flota{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:10px;text-decoration:none}
.wa-ico{width:54px;height:54px;border-radius:50%;background:#1f2a24;color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15)}
.wa-txt{background:#fff;color:var(--tinta);font:600 13px/1 var(--txt);padding:9px 12px;border-radius:999px;box-shadow:0 8px 20px -10px rgba(0,0,0,.4);border:1px solid var(--linea)}
.wa-flota:hover .wa-ico{background:#25d366}

/* revisión (solo con ?revision) */
.rev{position:fixed;right:14px;top:90px;z-index:30;background:#fff;border:2px solid var(--oro);border-radius:12px;padding:14px;font-size:13px;width:250px;box-shadow:0 18px 40px -16px rgba(0,0,0,.4)}
.rev b{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oro);margin-bottom:8px}
.rev label{display:flex;align-items:center;gap:8px;margin:6px 0}
.rev select{width:100%;font:inherit;padding:6px}
.rev .nota{color:var(--gris);margin-top:8px;font-size:12px;line-height:1.4}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;min-height:auto}
  .hero-foto{order:0;height:min(64svh,560px);min-height:0}
  .hero-foto::after{background:linear-gradient(180deg,rgba(11,11,12,.55) 0%,rgba(11,11,12,0) 22%,rgba(11,11,12,0) 55%,var(--negro) 100%)}
  .hero-txt{order:1;padding:0 20px 40px;margin-top:-90px}
  .datos .wrap{grid-template-columns:repeat(2,1fr)}.dato:nth-child(3){border-left:0}.dato{border-top:1px solid rgba(255,255,255,.08)}
  .panel{grid-template-columns:1fr}.panel-foto{min-height:260px;order:-1}
  .porque{grid-template-columns:1fr 1fr}
  .sedes{grid-template-columns:1fr 1fr}.sede-card{height:300px}
  .pasos{grid-template-columns:1fr}
  .fotos{grid-template-columns:1fr 1fr}.fotos img:first-child{grid-column:1/-1}
}
@media (max-width:600px){
  body{font-size:16px}
  .wrap{padding-inline:16px}
  .top img{height:38px}
  .hero-txt{padding:0 16px 32px;margin-top:-70px}
  .hero .acciones .btn-oro{width:100%}
  .hero .eyebrow{font-size:11px;letter-spacing:1.6px}

/* ===== Estado: idioma y sede (por la URL: ?sede=miramar&lang=es, o #miramar) ===== */
const qs = new URLSearchParams(location.search);
const leer = k => { try { return localStorage.getItem('jam_pa_' + k); } catch (e) { return null; } };
const guardar = (k, v) => { try { localStorage.setItem('jam_pa_' + k, v); } catch (e) {} };
let lang = qs.get('lang') || leer('lang') || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en');
let sede = (qs.get('sede') || location.hash.slice(1) || '').toLowerCase();
if (!SEDES.some(s => s.id === sede)) sede = '';
const S = () => SEDES.find(s => s.id === sede);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function beneficio(s) {
  if (s.gratis) return `<div class="badge">★ ${esc(T[lang].gratis_sede(s.n))}</div>`;
  if (CFG.garantia14) return `<div class="badge garantia">✓ ${esc(T[lang].garantia_sede(s.n))}</div>`;
  return '';
}

function pintar() {
  const t = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
  document.querySelectorAll('.idioma button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  const s = S();
  // portada de la sede (si llegó por el anuncio de una sede): titular con la ciudad, días, horario y grupos de ESA sede
  let cinta = t.cinta;
  document.querySelector('.hero').classList.toggle('con-sede', !!s);
  if (s) {
    const us = s.grupos.flatMap(g => [...g[0].matchAll(/U(\d+)/g)].map(m => +m[1])), rango = t.rango(Math.min(...us), Math.max(...us));
    const min = h => { const [a, b] = h.trim().split(':'); return (parseInt(a) % 12 + 12) * 60 + parseInt(b); }, hora = m => `${Math.floor(m / 60) - 12}:${String(m % 60).padStart(2, '0')}`;
    const ini = Math.min(...s.grupos.map(g => min(g[1].split('–')[0]))), fin = Math.max(...s.grupos.map(g => min(g[1].split('–')[1]))), horas = `${hora(ini)}–${hora(fin)} PM`;
    document.querySelector('.hero .eyebrow').textContent = t.eyebrow_sede(s.n);
    document.querySelector('.hero h1').innerHTML = t.h1_sede(esc(s.n));
    document.querySelector('.hero .sub').textContent = t.sub_sede(s.lugar, rango);
    document.querySelectorAll('.hero [data-registro] span:first-child, .fija [data-registro] span').forEach(x => { x.textContent = t.reg_sede(s.n); });
    document.querySelector('#btn-sedes span').textContent = t.ver_horarios;
    document.getElementById('hero-sede').innerHTML = `<div class="hero-datos"><div><small>${t.k_dias}</small><b>${esc(s.dias[lang])}</b></div><div><small>${t.k_horario}</small><b>${horas}</b></div><div><small>${t.k_grupos}</small><b>${esc(t.n_grupos(s.grupos.length))}</b></div></div>
      <p class="hero-lugar">📍 ${esc(s.lugar)}, ${esc(s.dir.split(',').slice(-2, -1)[0]?.trim() || s.n)} · <button type="button" data-sede="">${t.cambiar}</button></p>`;
    cinta = t.cinta_sede(s, rango, horas);
    // sección de horarios: ya no pide "Elige tu sede" si el padre llegó a una sede
    document.querySelector('#sedes [data-t="sedes_eb"]').textContent = t.sedes_eb_sede;
    document.querySelector('#sedes [data-t="sedes_h"]').textContent = t.sedes_h_sede(s.n);
    document.querySelector('#sedes [data-t="sedes_p"]').textContent = t.sedes_p_sede;
  } else document.getElementById('hero-sede').innerHTML = '';
  // franja dorada: los textos dos veces seguidas para que el movimiento no tenga corte
  const fila = cinta.map(x => `<span>${esc(x)}</span><i>★</i>`).join('');
  document.getElementById('cinta').innerHTML = fila + fila;
  document.getElementById('hero-badge').innerHTML = s ? beneficio(s) : `<div class="badge">★ ${esc(t.gratis_badge)}</div>`;
  // sedes: panel de la elegida o las 5 tarjetas
  const zona = document.getElementById('sede-zona');
  if (s) {
    const precio = !CFG.precios ? '' : `<div class="fila"><div class="k">${t.plan}</div><div class="precio">${s.id === 'doral' ? esc(t.plan_doral) : esc(t.desde(s.desde))}<small>${esc(t.plan_nota)}</small></div></div>`;
    zona.innerHTML = `<div class="panel"><div class="panel-info">
      ${beneficio(s)}
      <h3>${esc(s.n)}</h3>
      <p class="lugar">${esc(s.lugar)} · ${esc(s.dir)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.lugar + ', ' + s.dir)}" target="_blank" rel="noopener">${t.mapa}</a></p>
      <div class="fila"><div class="k">${t.cuando}</div><div>${esc(s.dias[lang])}</div></div>
      <div class="fila"><div class="k">${t.grupos}</div><ul class="grupos">${s.grupos.map(g => `<li><b>${esc(g[0])}</b><span>${esc(g[1])}</span></li>`).join('')}</ul></div>
      ${precio}
      <div class="acciones"><a class="btn btn-oro" data-registro href="#">${esc(t.reg_sede(s.n))}<span class="flecha">→</span></a></div>
      <div class="otra"><button type="button" data-sede="">${t.otra}</button></div>
    </div><div class="panel-foto"><img src="../assets/img/${s.id === 'doral' || s.id === 'davie' ? 'remate' : 'amigos'}_1600.jpg" alt="" loading="lazy" style="object-position:50% 30%"></div></div>`;
  } else {
    zona.innerHTML = `<div class="sedes">${SEDES.map(x => `<button type="button" class="sede-card" data-sede="${x.id}" aria-label="${esc(x.n)}">
      <img src="../assets/img/ciudad_${x.id}.jpg" alt="" loading="lazy">
      ${x.gratis ? `<span class="sc-cinta">★ ${t.chip_gratis}</span>` : ''}
      <span class="sc-info"><span class="sc-zona">${esc(x.zona)}</span><h3>${esc(x.n)}</h3><span class="sc-dias">${esc(x.dias[lang])} · ${x.grupos.length} ${lang === 'es' ? 'grupos' : 'groups'}</span><span class="sc-ir">${t.ver_horarios}</span></span>
    </button>`).join('')}</div>`;
  }
  // paso 2: paquete exacto
  document.getElementById('pkg').innerHTML = s ? s.grupos.map(g => `“${esc(g[2])}…”`).join('<br>') : esc(t.pkg_todas);
  // preguntas
  document.getElementById('faq').innerHTML = t.faq.map((q, i) => `<details${i === 0 ? ' open' : ''}><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('');
  // enlaces
  const wa = `https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(t.wa_txt(s ? s.n : ''))}`;
  document.querySelectorAll('[data-wa]').forEach(a => a.href = wa);
  document.querySelectorAll('[data-registro]').forEach(a => { a.href = enlace(); a.target = '_blank'; a.rel = 'noopener'; });
}

function enlace() {   // UTM del anuncio → PlayMetrics, para saber de dónde vino cada inscripción
  const u = new URL(CFG.playmetrics);
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(k => { if (qs.get(k)) u.searchParams.set(k, qs.get(k)); });
  return u.toString();
}

/* ===== Medición: al tocar "Register" (Meta y Google, si están instalados en la web) ===== */
// 29-10: el píxel lo pone el sitio (WPCode, 3753924101424890). Un solo Lead por visita aunque se toque Register varias veces,
// con eventID (deduplicación con la API de conversiones). El fragmento del sitio no cuenta los botones [data-registro].
const enviados = {};
function medir(tipo) {
  const s = S(), datos = { content_name: 'Pre-Academy 2026/27', content_category: s ? s.n : 'all locations' };
  const ev = tipo === 'registro' ? 'Lead' : 'Contact';
  if (enviados[ev]) return; enviados[ev] = true;
  try { if (window.fbq) fbq('track', ev, datos, { eventID: ev.toLowerCase() + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) }); } catch (e) {}
  try { if (window.gtag) gtag('event', tipo === 'registro' ? 'generate_lead' : 'contact', { program: 'pre_academy', location: datos.content_category }); } catch (e) {}
}
if (CFG.pixel) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CFG.pixel); fbq('track', 'PageView');
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (b) { lang = b.dataset.lang; guardar('lang', lang); pintar(); return; }
  const c = e.target.closest('[data-sede]');
  if (c) { sede = c.dataset.sede; history.replaceState(null, '', sede ? '#' + sede : location.pathname + location.search); pintar();
    if (c.classList.contains('sede-card') || c.closest('.otra') || c.closest('.hero-sede')) document.getElementById('sedes').scrollIntoView({ behavior: 'smooth' }); return; }
  if (e.target.closest('[data-registro]')) medir('registro');
  if (e.target.closest('[data-wa]')) medir('whatsapp');
});

/* ===== Panel de revisión (solo con ?revision en la URL) ===== */
if (qs.has('revision')) {
  const r = document.createElement('div'); r.className = 'rev';
  r.innerHTML = `<b>Vista de revisión</b>
    <label>Sede <select id="rv-sede"><option value="">Todas (página general)</option>${SEDES.map(s => `<option value="${s.id}">${s.n}</option>`).join('')}</select></label>
    <label><input type="checkbox" id="rv-gar"> Garantía 14 días (Doral y Davie)</label>
    <label><input type="checkbox" id="rv-pre" checked> Mostrar precios</label>
    <div class="nota">Cada sede tiene su propia dirección para su anuncio: ?sede=downtown, doral, davie, miramar, materbay. Este panel no aparece en la versión publicada.</div>`;
  document.body.appendChild(r);
  const sel = r.querySelector('#rv-sede'); sel.value = sede;
  sel.onchange = () => { sede = sel.value; pintar(); };
  r.querySelector('#rv-gar').onchange = e => { CFG.garantia14 = e.target.checked; pintar(); };
  r.querySelector('#rv-pre').onchange = e => { CFG.precios = e.target.checked; pintar(); };
}
pintar();

/* ===== Portada en video (secuencia de fotos reales con la camiseta 2026-27) ===== */
(function () {
  const hero = document.querySelector('.hero'), variante = (qs.get('hero') || 'd').toLowerCase();
  if ('abcd'.includes(variante)) hero.classList.add('v-' + variante);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const movil = matchMedia('(max-width:800px)').matches, pc = matchMedia('(min-width:901px)').matches, mosaico = variante === 'a' && pc;
  if (variante === 'd' && pc) {   // D en el computador: un solo video horizontal a todo lo ancho
    const v = document.querySelector('.hero-ancho-video'); v.src = '../assets/video/hero_ancho.mp4';
    v.addEventListener('canplay', () => v.play().catch(() => {}), { once: true }); v.play().catch(() => {});
    return;
  }
  // en el mosaico, los 3 paneles usan el mismo video empezando en fotos distintas (nunca se repite la misma foto a la vez)
  [...document.querySelectorAll('.hero-video')].slice(0, mosaico ? 3 : 1).forEach(v => {
    const desde = parseFloat(v.dataset.desde || 0);
    v.src = '../assets/video/' + (movil ? 'hero_movil.mp4' : 'hero_pc.mp4');
    if (desde) v.addEventListener('loadedmetadata', () => { v.currentTime = desde; }, { once: true });
    v.addEventListener('playing', () => v.classList.add('lista'), { once: true });
    const play = () => v.play().catch(() => {});
    v.addEventListener('canplay', play, { once: true }); play();
  });
})();
</script>
